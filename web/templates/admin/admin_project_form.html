{{define "admin_project_form.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  {{template "admin_head" .}}
  <title>{{.title}} — Admin</title>
</head>
<body class="ad-body">
<div class="ad-layout">
  {{template "admin_sidebar" .}}
  <main class="ad-main">
    <div class="ad-topbar">
      <div class="ad-topbar-l">
        <button class="ad-burger" onclick="window.dispatchEvent(new CustomEvent('toggle-sidebar'))" aria-label="Menu">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="ad-back" href="/admin/projects">←</a>
        <div class="ad-topbar-title">{{.title}}</div>
      </div>
      <div class="ad-topbar-actions"><span class="ad-avatar">S</span></div>
    </div>

    <div class="ad-content" style="max-width:680px;">
      {{if .error}}<div class="ad-alert ad-alert-err">{{.error}}</div>{{end}}

      {{$p := .project}}
      <form method="POST" action="{{if $p}}/admin/projects/{{$p.ID}}{{else}}/admin/projects{{end}}" enctype="multipart/form-data" class="ad-form">
        <div>
          <label class="ad-label">Title <span class="ad-req">*</span></label>
          <input class="ad-input" type="text" name="title" required value="{{if $p}}{{$p.Title}}{{end}}" placeholder="My Project" />
        </div>
        <div>
          <label class="ad-label">Description</label>
          <textarea class="ad-textarea" name="description" rows="3" placeholder="What does this project do?">{{if $p}}{{$p.Description}}{{end}}</textarea>
        </div>
        <div>
          <label class="ad-label">Tech stack <span class="ad-hint">(comma-separated)</span></label>
          <input class="ad-input ad-mono-input" type="text" name="tech_stack" value="{{if .techStackRaw}}{{.techStackRaw}}{{end}}" placeholder="Go, PostgreSQL, Docker, Redis" />
        </div>
        <div class="ad-grid-2">
          <div>
            <label class="ad-label">Live URL</label>
            <input class="ad-input" type="url" name="live_url" value="{{if $p}}{{$p.LiveURL}}{{end}}" placeholder="https://…" />
          </div>
          <div>
            <label class="ad-label">GitHub URL</label>
            <input class="ad-input" type="url" name="github_url" value="{{if $p}}{{$p.GithubURL}}{{end}}" placeholder="https://github.com/…" />
          </div>
        </div>

        <!-- image -->
        <div x-data="{ preview:'{{if $p}}{{$p.ImageURL}}{{end}}', onFile(e){ const f=e.target.files[0]; if(f) this.preview=URL.createObjectURL(f); } }">
          <label class="ad-label">Project image</label>
          <template x-if="preview">
            <div style="margin-bottom:12px; position:relative;">
              <img :src="preview" alt="preview" class="ad-img-prev" />
              <button type="button" @click="preview=''; $refs.fileInput.value=''; $refs.urlInput.value=''" style="position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; background:rgba(10,10,14,.8); color:var(--muted); border:none; cursor:pointer;">✕</button>
            </div>
          </template>
          <label class="ad-dropzone">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--faint);"><path stroke-linecap="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span style="font-size:13px; color:var(--muted);" x-text="preview ? 'Change image…' : 'Click to upload image'"></span>
            <span style="font-size:12px; color:var(--faint);">JPG, PNG, WebP, GIF · max 5MB</span>
            <input x-ref="fileInput" type="file" name="image_file" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;" @change="onFile($event)" />
          </label>
          <div style="margin-top:12px;">
            <label class="ad-label" style="color:var(--faint);">Or use an image URL</label>
            <input x-ref="urlInput" class="ad-input" type="text" name="image_url" value="{{if $p}}{{$p.ImageURL}}{{end}}" placeholder="https://…" @input="if($event.target.value) preview=$event.target.value" />
          </div>
        </div>

        <div class="ad-grid-2">
          <div>
            <label class="ad-label">Order index</label>
            <input class="ad-input" type="number" name="order_index" min="0" value="{{if $p}}{{$p.OrderIndex}}{{else}}0{{end}}" />
          </div>
          <div style="display:flex; align-items:flex-end; padding-bottom:12px;">
            <label class="ad-check">
              <input type="checkbox" name="featured" {{if $p}}{{if $p.Featured}}checked{{end}}{{end}} />
              <span>Featured on homepage</span>
            </label>
          </div>
        </div>

        <div class="ad-form-foot">
          <button type="submit" class="ad-btn">{{if $p}}Update project{{else}}Create project{{end}}</button>
          <a class="ad-cancel" href="/admin/projects">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
{{end}}
