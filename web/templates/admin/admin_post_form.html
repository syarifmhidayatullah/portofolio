{{define "admin_post_form.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  {{template "admin_head" .}}
  <title>{{.title}} — Admin</title>
  <link rel="stylesheet" href="/static/css/easymde-2.18.0.min.css" />
  <script src="/static/js/easymde-2.18.0.min.js"></script>
  <style>
    .EasyMDEContainer .CodeMirror { background:var(--bg); color:var(--ink); border:1px solid var(--navborder); border-radius:0 0 10px 10px; font-family:var(--font-mono); font-size:14px; min-height:380px; }
    .editor-toolbar { background:var(--surface2); border:1px solid var(--navborder); border-radius:10px 10px 0 0; }
    .editor-toolbar button { color:var(--muted) !important; }
    .editor-toolbar button:hover, .editor-toolbar button.active { background:var(--border) !important; color:var(--ink) !important; }
    .editor-preview { background:var(--bg); color:var(--muted); }
    .CodeMirror-scroll { min-height:380px; }
  </style>
</head>
<body class="ad-body">
<div class="ad-layout">
  {{template "admin_sidebar" .}}
  <main class="ad-main">
    <div class="ad-topbar">
      <div class="ad-topbar-l">
        <button class="ad-burger" onclick="window.dispatchEvent(new CustomEvent('toggle-sidebar'))" aria-label="Menu">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="ad-back" href="/admin/posts">←</a>
        <div class="ad-topbar-title">{{.title}}</div>
      </div>
      <div class="ad-topbar-actions"><span class="ad-avatar">S</span></div>
    </div>

    <div class="ad-content" style="max-width:880px;">
      {{if .error}}<div class="ad-alert ad-alert-err">{{.error}}</div>{{end}}

      {{$post := .post}}
      <form method="POST" action="{{if $post}}/admin/posts/{{$post.ID}}{{else}}/admin/posts{{end}}" enctype="multipart/form-data" class="ad-form">
        <div>
          <label class="ad-label">Title <span class="ad-req">*</span></label>
          <input class="ad-input" type="text" name="title" required value="{{if $post}}{{$post.Title}}{{end}}" placeholder="My awesome blog post" />
        </div>
        <div>
          <label class="ad-label">Excerpt <span class="ad-hint">(auto-generated if empty)</span></label>
          <input class="ad-input" type="text" name="excerpt" value="{{if $post}}{{$post.Excerpt}}{{end}}" placeholder="Short description shown in previews..." />
        </div>
        <div>
          <label class="ad-label">Tags <span class="ad-hint">(comma-separated)</span></label>
          <input class="ad-input ad-mono-input" type="text" name="tags" value="{{if .tagsRaw}}{{.tagsRaw}}{{end}}" placeholder="Go, Backend, Architecture" />
        </div>

        <!-- cover image -->
        <div x-data="{ preview:'{{if $post}}{{$post.CoverImage}}{{end}}', onFile(e){ const f=e.target.files[0]; if(f) this.preview=URL.createObjectURL(f); } }">
          <label class="ad-label">Cover image</label>
          <template x-if="preview">
            <div style="margin-bottom:12px; position:relative;">
              <img :src="preview" alt="preview" class="ad-img-prev" />
              <button type="button" @click="preview=''; $refs.fileInput.value=''; $refs.urlInput.value=''" style="position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; background:rgba(10,10,14,.8); color:var(--muted); border:none; cursor:pointer;">✕</button>
            </div>
          </template>
          <label class="ad-dropzone">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--faint);"><path stroke-linecap="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span style="font-size:13px; color:var(--muted);" x-text="preview ? 'Change image…' : 'Click to upload cover image'"></span>
            <span style="font-size:12px; color:var(--faint);">JPG, PNG, WebP, GIF · max 5MB</span>
            <input x-ref="fileInput" type="file" name="cover_file" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;" @change="onFile($event)" />
          </label>
          <div style="margin-top:12px;">
            <label class="ad-label" style="color:var(--faint);">Or use an image URL</label>
            <input x-ref="urlInput" class="ad-input" type="text" name="cover_image" value="{{if $post}}{{$post.CoverImage}}{{end}}" placeholder="https://… or /static/uploads/…" @input="if($event.target.value) preview=$event.target.value" />
          </div>
        </div>

        <div>
          <label class="ad-label">Content (Markdown) <span class="ad-req">*</span></label>
          <textarea id="editor" name="content">{{if $post}}{{$post.Content}}{{end}}</textarea>
        </div>

        <label class="ad-check">
          <input type="checkbox" name="published" {{if $post}}{{if $post.Published}}checked{{end}}{{end}} />
          <span>Publish immediately</span>
        </label>

        <div class="ad-form-foot">
          <button type="submit" class="ad-btn">{{if $post}}Update post{{else}}Create post{{end}}</button>
          <a class="ad-cancel" href="/admin/posts">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script>
  localStorage.removeItem('smde_post-editor')
  const easyMDE = new EasyMDE({
    element: document.getElementById('editor'),
    spellChecker: false,
    autosave: { enabled: false },
    toolbar: ['bold','italic','heading','|','quote','unordered-list','ordered-list','|','link','image','code','table','|','preview','side-by-side','fullscreen','|','guide'],
  })
  document.querySelector('form').addEventListener('submit', () => { easyMDE.codemirror.save() })
</script>
</body>
</html>
{{end}}
