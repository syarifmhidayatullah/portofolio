{{define "admin_sidebar"}}
<aside class="ad-sidebar" x-data="{ open:false }" @toggle-sidebar.window="open = !open" @keydown.escape.window="open = false" :class="open ? 'ad-open' : ''">
  <div class="ad-side-backdrop" @click="open = false"></div>
  <div class="ad-side-panel">
    <a class="ad-logo" href="/" target="_blank">syarifhidayat<span style="color:var(--red);">.dev</span> <span class="ad-logo-sub">admin</span></a>
    <nav class="ad-nav">
      <a class="ad-nav-item" href="/admin" data-match="/admin"><span class="ad-dot" style="background:var(--red);"></span>Dashboard</a>
      <a class="ad-nav-item" href="/admin/posts" data-match="/admin/posts"><span class="ad-dot" style="background:var(--blue);"></span>Posts</a>
      <a class="ad-nav-item" href="/admin/projects" data-match="/admin/projects"><span class="ad-dot" style="background:var(--yellow);"></span>Projects</a>
      <a class="ad-nav-item" href="/admin/messages" data-match="/admin/messages"><span class="ad-dot" style="background:var(--green);"></span>Messages{{if .unreadCount}}<span class="ad-badge">{{.unreadCount}}</span>{{end}}</a>
      <a class="ad-nav-item" href="/admin/profile" data-match="/admin/profile"><span class="ad-dot" style="background:var(--red);"></span>Profile</a>
    </nav>
    <div class="ad-side-foot">
      <a class="ad-nav-item" href="/" target="_blank">↗&nbsp; View site</a>
      <form method="POST" action="/admin/logout">
        <button class="ad-nav-item" type="submit">⏻&nbsp; Logout</button>
      </form>
    </div>
  </div>
</aside>
<script>
  (function () {
    var path = window.location.pathname;
    document.querySelectorAll('.ad-nav .ad-nav-item[data-match]').forEach(function (a) {
      var m = a.getAttribute('data-match');
      var active = (m === '/admin') ? (path === '/admin' || path === '/admin/') : (path.indexOf(m) === 0);
      if (active) a.classList.add('active');
    });
  })();
</script>
{{end}}
