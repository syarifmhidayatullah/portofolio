{{define "navbar"}}
<header class="nav" x-data="{ open:false, dark: document.documentElement.getAttribute('data-theme') !== 'light' }" @keydown.escape.window="open=false">
  <nav class="wrap nav-inner">
    <a href="/" class="brand">syarifhidayat<span class="accent">.</span>dev</a>

    <div class="nav-links">
      <a href="/projects" class="{{if eq .activeNav "projects"}}active{{end}}">Projects</a>
      <a href="/blog" class="{{if eq .activeNav "blog"}}active{{end}}">Writing</a>
      <a href="/#contact">Contact</a>
    </div>

    <div class="nav-ctrls">
      <button type="button" class="icon-btn" :aria-label="dark ? 'Switch to light theme' : 'Switch to dark theme'"
        @click="dark=!dark; document.documentElement.setAttribute('data-theme', dark?'dark':'light'); localStorage.setItem('theme', dark?'dark':'light')"
        x-text="dark ? '☀' : '☾'">☀</button>
      <button type="button" class="icon-btn nav-burger" aria-label="Menu" :aria-expanded="open" @click="open=!open" x-text="open ? '✕' : '☰'">☰</button>
    </div>

    <div class="nav-mobile" x-show="open" x-transition.opacity @click.away="open=false" style="display:none;">
      <a href="/" @click="open=false">Home</a>
      <a href="/projects" @click="open=false">Projects</a>
      <a href="/blog" @click="open=false">Writing</a>
      <a href="/#contact" @click="open=false">Contact</a>
    </div>
  </nav>
</header>
{{end}}
